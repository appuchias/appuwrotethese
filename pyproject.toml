[project]
name = "appuwrotethese"
version = "1.3.1"
requires-python = ">=3.12"
dependencies = [
    "asgiref==3.8.1 ; python_full_version >= '3.8'",
    "certifi==2025.1.31 ; python_full_version >= '3.6'",
    "charset-normalizer==3.4.1 ; python_full_version >= '3.7'",
    "crispy-bootstrap5==2024.10 ; python_full_version >= '3.8'",
    "django==5.1.6 ; python_full_version >= '3.10'",
    "django-crispy-forms==2.3 ; python_full_version >= '3.8'",
    "django-user-agents==0.4.0",
    "geographiclib==2.0 ; python_full_version >= '3.7'",
    "geopy==2.4.1 ; python_full_version >= '3.7'",
    "gunicorn==23.0.0 ; python_full_version >= '3.7'",
    "idna==3.10 ; python_full_version >= '3.6'",
    "packaging==24.2 ; python_full_version >= '3.8'",
    "python-dotenv==1.1.0 ; python_full_version >= '3.9'",
    "pytz==2025.1",
    "requests==2.32.3 ; python_full_version >= '3.8'",
    "sqlparse==0.5.3 ; python_full_version >= '3.8'",
    "tqdm==4.67.1 ; python_full_version >= '3.7'",
    "tzdata==2025.1 ; python_full_version >= '2'",
    "ua-parser==1.0.1 ; python_full_version >= '3.9'",
    "ua-parser-builtins==0.18.0.post1 ; python_full_version >= '3.9'",
    "urllib3==2.3.0 ; python_full_version >= '3.9'",
    "user-agents==2.2.0",
    "whitenoise==6.9.0 ; python_full_version >= '3.9'",
]

[tool.black]
color = true
# extend-exclude = "( ^/manage.py | .+/migrations )"

[tool.isort]
skip_glob = [ "*/manage.py", "*/migrations" ]
profile = "black"
multi_line_output = 3
combine_as_imports = true
combine_straight_imports = true
skip_gitignore = true

[tool.ruff]
target-version = "py312"
exclude = [ "*/manage.py", "*/migrations" ]
